  <ellipse cx="250" cy="252" rx="60" ry="26" fill="#4a4a52"/>
  <ellipse cx="250" cy="236" rx="40" ry="8" fill="#4f6b3a" opacity="0.85"/>
  <ellipse cx="380" cy="268" rx="38" ry="16" fill="#3a3a42"/>
  <ellipse cx="560" cy="248" rx="45" ry="20" fill="#55555d"/>
  <ellipse cx="560" cy="236" rx="28" ry="6" fill="#4f6b3a" opacity="0.85"/>

  <ellipse class="petal" cx="200" cy="0" rx="5" ry="2.5" fill="#f6c6d0"/>

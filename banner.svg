<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1033"/>
      <stop offset="0.5" stop-color="#4b2c6e"/>
      <stop offset="1" stop-color="#d98aa8"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9f1" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffc2d8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3e8ff"/>
      <stop offset="1" stop-color="#b9a4e6"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a7bd0"/>
      <stop offset="1" stop-color="#3b2d6e"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <style>
    .flow { stroke-dasharray: 18 14; animation: flow 1.2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -32; } }
    .ripple { transform-box: fill-box; transform-origin: center; animation: ripple 3s ease-out infinite; }
    .r2 { animation-delay: -1.5s; }
    @keyframes ripple { from { transform: scale(0.4); opacity: 0.7; } to { transform: scale(1.3); opacity: 0; } }
    .petal { animation: petal 9s linear infinite; }
    .p2 { animation-delay: -3s; }
    .p3 { animation-delay: -6s; }
    @keyframes petal {
      0% { transform: translate(0,-10px) rotate(0deg); opacity: 0; }
      10% { opacity: 0.9; }
      100% { transform: translate(60px,310px) rotate(300deg); opacity: 0; }
    }
    .title { animation: rise 1.4s ease-out both; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>

  <!-- Ciel et soleil -->
  <rect width="1200" height="300" fill="url(#sky)"/>
  <circle cx="880" cy="170" r="150" fill="url(#sun)"/>
  <circle cx="880" cy="170" r="30" fill="#fff1f6" opacity="0.95"/>

  <!-- Montagnes lointaines -->
  <path d="M0 170 Q90 120 170 150 T340 140 T520 160 T720 130 T920 150 T1100 120 T1200 145 L1200 300 L0 300 Z" fill="#6a4a8e" opacity="0.8"/>
  <!-- Montagnes proches -->
  <path d="M0 200 Q140 160 280 190 T560 185 T840 195 T1200 180 L1200 300 L0 300 Z" fill="#3b2660"/>

  <!-- Cascade -->
  <path d="M580 105 Q592 180 580 250" stroke="url(#fall)" stroke-width="22" fill="none" stroke-linecap="round" class="flow" filter="url(#blur)"/>
  <path d="M575 100 L605 100 L612 112 L568 112 Z" fill="#5a4a7a"/>

  <!-- Bassin -->
  <ellipse cx="580" cy="262" rx="130" ry="18" fill="url(#water)"/>
  <ellipse cx="580" cy="262" rx="60" ry="8" fill="none" stroke="#d9ccff" stroke-width="1.5" class="ripple"/>
  <ellipse cx="580" cy="262" rx="60" ry="8" fill="none" stroke="#d9ccff" stroke-width="1.5" class="ripple r2"/>

  <!-- Cerisier gauche -->
  <path d="M120 290 Q135 240 150 200 Q170 170 200 160" stroke="#2c1a38" stroke-width="10" fill="none" stroke-linecap="round"/>
  <g fill="#f7c6d9" opacity="0.92">
    <circle cx="190" cy="120" r="46"/>
    <circle cx="140" cy="150" r="40"/>
    <circle cx="240" cy="150" r="38"/>
    <circle cx="170" cy="100" r="30"/>
  </g>
  <g fill="#e99ab8" opacity="0.6">
    <circle cx="210" cy="135" r="20"/>
    <circle cx="130" cy="130" r="18"/>
  </g>

  <!-- Cerisier droit -->
  <path d="M1040 290 Q1025 230 1010 190 Q990 160 960 150" stroke="#2c1a38" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M1010 190 Q1040 170 1060 130" stroke="#2c1a38" stroke-width="6" fill="none" stroke-linecap="round"/>
  <g fill="#f7c6d9" opacity="0.92">
    <circle cx="1010" cy="110" r="58"/>
    <circle cx="950" cy="140" r="42"/>
    <circle cx="1070" cy="120" r="40"/>
    <circle cx="1000" cy="60" r="36"/>
  </g>
  <g fill="#e99ab8" opacity="0.6">
    <circle cx="1040" cy="95" r="22"/>
    <circle cx="975" cy="110" r="18"/>
  </g>

  <!-- Premier plan -->
  <path d="M0 255 Q300 240 600 252 T1200 250 L1200 300 L0 300 Z" fill="#1a1033"/>

  <!-- Pétales -->
  <ellipse class="petal" cx="330" cy="40" rx="4" ry="2" fill="#f7c6d9"/>
  <ellipse class="petal p2" cx="700" cy="30" rx="4" ry="2" fill="#f7c6d9"/>
  <ellipse class="petal p3" cx="860" cy="60" rx="4" ry="2" fill="#e99ab8"/>

  <!-- Titre -->
  <g class="title">
    <text x="60" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="54" font-weight="600" fill="#fff8fb" letter-spacing="4">CHRIS N'CHO</text>
    <text x="62" y="178" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#f5c6dc" letter-spacing="4">COMPUTER SCIENCE STUDENT</text>
  </g>
</svg>

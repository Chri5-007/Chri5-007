  <rect x="760" y="160" width="320" height="52" fill="#5a3a2a"/>
  <path d="M770 120 Q900 90 1030 120 L1060 150 L740 150 Z" fill="#2b1d18"/>
  <rect x="880" y="80" width="40" height="12" fill="#2b1d18"/>
  <path d="M700 170 Q900 140 1100 170 L1110 182 L690 182 Z" fill="#2b1d18"/>
  <rect x="770" y="170" width="8" height="40" fill="#3b2a22"/>
  <rect x="1022" y="170" width="8" height="40" fill="#3b2a22"/>
  <rect x="870" y="175" width="60" height="35" fill="#1a100c"/>
  <rect x="790" y="178" width="50" height="26" fill="#1a100c" opacity="0.8"/>
  <rect x="960" y="178" width="50" height="26" fill="#1a100c" opacity="0.8"/>

  <rect x="0" y="224" width="1200" height="76" fill="#d9cdb8"/>
  <g stroke="#bfb29a" stroke-width="1.5" fill="none" opacity="0.7">
    <path d="M0 236 Q300 230 600 238 T1200 236"/>
    <path d="M0 252 Q300 246 600 254 T1200 252"/>
    <path d="M0 268 Q300 262 600 270 T1200 268"/>
    <path d="M0 284 Q300 278 600 286 T1200 284"/>

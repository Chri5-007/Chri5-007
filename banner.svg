<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" shape-rendering="crispEdges">
  <defs>
    <clipPath id="fallClip"><rect x="420" y="90" width="80" height="150"/></clipPath>
  </defs>
  <style>
    .fall { animation: flow 0.9s linear infinite; }
    @keyframes flow { from { transform: translateY(0); } to { transform: translateY(30px); } }
    .bob { animation: bob 2.4s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .glint { animation: glint 1.8s steps(2) infinite; }
    .g2 { animation-delay: -0.9s; }
    @keyframes glint { 0%,100% { opacity: 1; } 50% { opacity: 0.2; } }
    .leaf { animation: fall 9s linear infinite; }
    .l2 { animation-delay: -4s; }
    @keyframes fall { 0% { transform: translate(0,-10px); opacity: 0; } 10% { opacity: 1; } 100% { transform: translate(40px,300px); opacity: 0; } }
  </style>

  <!-- Ciel en bandes -->
  <rect width="1200" height="50" fill="#1b2a4a"/>
  <rect y="50" width="1200" height="50" fill="#22386a"/>
  <rect y="100" width="1200" height="50" fill="#2c4f7e"/>
  <rect y="150" width="1200" height="50" fill="#3d6e9a"/>
  <rect y="200" width="1200" height="100" fill="#5b93b4"/>

  <!-- Étoiles -->
  <rect x="120" y="22" width="10" height="10" fill="#fff" class="glint"/>
  <rect x="330" y="48" width="10" height="10" fill="#fff" class="glint g2"/>
  <rect x="850" y="30" width="10" height="10" fill="#fff" class="glint g2"/>
  <rect x="1040" y="62" width="10" height="10" fill="#fff" class="glint"/>

  <!-- Montagnes lointaines -->
  <path d="M0 150 H60 V130 H100 V110 H140 V130 H180 V150 H260 V120 H300 V100 H340 V120 H380 V150 H480 V130 H520 V110 H560 V130 H600 V150 H720 V120 H760 V100 H800 V120 H840 V150 H960 V110 H1000 V90 H1040 V110 H1080 V150 H1200 V200 H0 Z" fill="#4a5d8a"/>
  <path d="M0 170 H80 V150 H120 V160 H200 V140 H240 V170 H400 V160 H440 V180 H700 V150 H760 V170 H900 V140 H940 V160 H1100 V150 H1200 V200 H0 Z" fill="#34466f"/>

  <!-- Falaise gauche -->
  <path d="M0 70 H120 V90 H170 V120 H200 V160 H230 V200 H250 V300 H0 Z" fill="#5a3d2b"/>
  <path d="M0 70 H120 V80 H0 Z" fill="#3f7a3a"/>
  <path d="M120 90 H170 V100 H120 Z" fill="#3f7a3a"/>
  <rect x="40" y="130" width="20" height="10" fill="#3f2a1e"/>
  <rect x="100" y="180" width="30" height="10" fill="#3f2a1e"/>
  <rect x="180" y="220" width="20" height="10" fill="#3f2a1e"/>

  <!-- Falaise droite -->
  <path d="M1200 60 H1090 V90 H1050 V130 H1010 V180 H980 V230 H960 V300 H1200 Z" fill="#5a3d2b"/>
  <path d="M1090 60 H1200 V70 H1090 Z" fill="#3f7a3a"/>
  <rect x="1060" y="150" width="20" height="10" fill="#3f2a1e"/>
  <rect x="1000" y="200" width="30" height="10" fill="#3f2a1e"/>

  <!-- Rebord de la cascade -->
  <rect x="400" y="84" width="120" height="10" fill="#3f7a3a"/>

  <!-- Cascade animée -->
  <g clip-path="url(#fallClip)">
    <rect x="420" y="90" width="80" height="150" fill="#9fd8f0"/>
    <g class="fall">
      <rect x="420" y="60" width="80" height="10" fill="#e6f7ff"/>
      <rect x="430" y="90" width="20" height="30" fill="#e6f7ff"/>
      <rect x="470" y="120" width="20" height="30" fill="#e6f7ff"/>
      <rect x="440" y="150" width="30" height="30" fill="#e6f7ff"/>
      <rect x="425" y="180" width="20" height="30" fill="#e6f7ff"/>
      <rect x="480" y="210" width="20" height="30" fill="#e6f7ff"/>
      <rect x="435" y="240" width="25" height="30" fill="#e6f7ff"/>
      <rect x="465" y="270" width="25" height="30" fill="#e6f7ff"/>
    </g>
  </g>

  <!-- Bassin -->
  <rect x="300" y="240" width="500" height="60" fill="#2b6c9c"/>
  <rect x="300" y="240" width="500" height="6" fill="#5b93b4"/>
  <rect x="340" y="262" width="60" height="6" fill="#7fb3c9" class="glint"/>
  <rect x="640" y="275" width="80" height="6" fill="#7fb3c9" class="glint g2"/>
  <rect x="760" y="256" width="50" height="6" fill="#7fb3c9" class="glint"/>

  <!-- Bateau -->
  <g class="bob">
    <g transform="translate(540,232)">
      <rect x="24" y="-22" width="3" height="22" fill="#3a2415"/>
      <rect x="27" y="-20" width="18" height="14" fill="#f4e6c8"/>
      <rect x="10" y="0" width="30" height="10" fill="#c98a4b"/>
      <rect x="0" y="10" width="60" height="8" fill="#6b3a1f"/>
      <rect x="4" y="18" width="52" height="4" fill="#4a2813"/>
    </g>
  </g>

  <!-- Feuilles -->
  <rect class="leaf" x="150" y="0" width="6" height="4" fill="#f6b97a"/>
  <rect class="leaf l2" x="880" y="0" width="6" height="4" fill="#e8956a"/>

  <!-- Titre -->
  <text x="62" y="122" font-family="Courier New, monospace" font-weight="bold" font-size="52" fill="#1b1b2f">CHRIS N'CHO</text>
  <text x="60" y="120" font-family="Courier New, monospace" font-weight="bold" font-size="52" fill="#fff6e6">CHRIS N'CHO</text>
  <text x="60" y="152" font-family="Courier New, monospace" font-size="16" fill="#ffd27a" letter-spacing="3">COMPUTER SCIENCE STUDENT</text>
</svg>

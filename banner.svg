<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2538"/>
      <stop offset="0.55" stop-color="#4a3a5a"/>
      <stop offset="1" stop-color="#d9a27a"/>
    </linearGradient>
  </defs>
  <style>
    .mist { animation: drift 25s linear infinite alternate; }
    .m2 { animation-duration: 40s; animation-delay: -10s; }
    @keyframes drift { from { transform: translateX(-50px); } to { transform: translateX(50px); } }
    .petal { animation: fall 9s linear infinite; }
    .p2 { animation-delay: -3s; }
    .p3 { animation-delay: -6s; }
    @keyframes fall { 0% { transform: translate(0,-20px) rotate(0deg); } 100% { transform: translate(90px,320px) rotate(360deg); } }
  </style>

  <rect width="1200" height="300" fill="url(#sky)"/>
  <circle cx="980" cy="110" r="34" fill="#fbe9d0" opacity="0.9"/>

  <path d="M0 175 L120 120 L240 165 L380 110 L520 170 L660 130 L800 175 L940 135 L1080 170 L1200 140 L1200 300 L0 300Z" fill="#5b6b8a" opacity="0.5"/>
  <ellipse class="mist" cx="300" cy="170" rx="260" ry="12" fill="#ffffff" opacity="0.12"/>
  <ellipse class="mist m2" cx="850" cy="185" rx="300" ry="10" fill="#ffffff" opacity="0.1"/>

  <g>
    <path d="M150 215 Q160 160 140 115" stroke="#3b2a22" stroke-width="8" fill="none" stroke-linecap="round"/>
    <ellipse cx="120" cy="112" rx="50" ry="14" fill="#2f4a3a"/>
    <ellipse cx="160" cy="97" rx="40" ry="12" fill="#2f4a3a"/>

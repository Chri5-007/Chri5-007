<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" shape-rendering="crispEdges">
  <defs>
    <pattern id="blossom" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#f5b5c8"/>
      <rect x="2" y="2" width="4" height="4" fill="#e98aa6"/>
      <rect x="8" y="6" width="4" height="4" fill="#e98aa6"/>
      <rect x="8" y="1" width="2" height="2" fill="#fff0f5"/>
      <rect x="1" y="8" width="2" height="2" fill="#fff0f5"/>
    </pattern>
    <pattern id="moss" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#3f7a3a"/>
      <rect x="1" y="1" width="3" height="3" fill="#5a9a48"/>
      <rect x="5" y="5" width="2" height="2" fill="#2e5e2a"/>
    </pattern>
    <pattern id="pinkbush" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#2e5e2a"/>
      <rect x="2" y="2" width="4" height="4" fill="#f5b5c8"/>
      <rect x="6" y="6" width="3" height="3" fill="#e98aa6"/>
    </pattern>
    <symbol id="pine" viewBox="0 0 30 60">
      <polygon points="15,0 18,6 16,6 21,14 18,14 25,24 20,24 28,34 20,34 30,46 0,46 10,34 2,34 10,24 5,24 12,14 9,14 14,6 12,6" fill="#1e3b2e"/>
      <rect x="13" y="46" width="4" height="14" fill="#3a2418"/>
    </symbol>
    <clipPath id="fallClip"><rect x="500" y="100" width="160" height="165"/></clipPath>
  </defs>

  <style>
    .fall { animation: flow 0.8s steps(4) infinite; }
    @keyframes flow { from { transform: translateY(0); } to { transform: translateY(40px); } }
    .shine { animation: shine 2s steps(2) infinite; }
    .s2 { animation-delay: -1s; }
    @keyframes shine { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
    .petal { animation: petal 8s steps(12) infinite; }
    .p2 { animation-delay: -3s; }
    .p3 { animation-delay: -5.5s; }
    @keyframes petal { 0% { transform: translate(0,0); opacity: 0; } 10% { opacity: 1; } 100% { transform: translate(60px,300px); opacity: 0; } }
  </style>

  <!-- Ciel -->
  <rect width="1200" height="300" fill="#f2e6d0"/>
  <rect width="1200" height="60" fill="#f7eedf"/>

  <!-- Montagnes lointaines -->
  <polygon points="0,150 40,120 70,135 110,90 150,120 190,100 230,140 280,110 320,150 380,125 430,150 480,105 530,140 580,120 640,150 700,110 760,140 810,95 860,130 910,115 960,150 1020,110 1080,140 1130,100 1170,130 1200,120 1200,300 0,300" fill="#5b7a8c"/>
  <polygon points="0,180 60,160 120,175 200,150 280,180 360,160 440,185 520,165 600,185 700,160 800,180 900,155 1000,180 1100,160 1200,175 1200,300 0,300" fill="#3e5a4f"/>

  <!-- Sapins en arrière-plan -->
  <use href="#pine" x="20" y="60" width="32" height="64"/>
  <use href="#pine" x="70" y="40" width="40" height="80"/>
  <use href="#pine" x="130" y="70" width="28" height="56"/>
  <use href="#pine" x="180" y="30" width="44" height="88"/>
  <use href="#pine" x="240" y="60" width="30" height="60"/>
  <use href="#pine" x="860" y="40" width="40" height="80"/>
  <use href="#pine" x="920" y="70" width="28" height="56"/>
  <use href="#pine" x="1000" y="30" width="44" height="88"/>
  <use href="#pine" x="1070" y="60" width="32" height="64"/>
  <use href="#pine" x="1140" y="50" width="36" height="72"/>

  <!-- Rochers centraux -->
  <polygon points="330,60 380,80 400,130 430,170 440,240 420,300 300,300 310,200 290,150 320,110" fill="#8a9099"/>
  <polygon points="350,90 375,105 390,140 400,200 380,260 340,260 340,160" fill="#b7bcc4"/>
  <polygon points="700,90 730,100 750,140 760,300 680,300 690,200 670,150" fill="#8a9099"/>
  <polygon points="710,120 730,140 735,200 720,260 700,200" fill="#5d646e"/>

  <!-- Falaise gauche -->
  <polygon points="0,90 40,80 80,95 110,80 150,100 170,130 200,150 230,190 260,300 0,300" fill="#9aa0a8"/>
  <polygon points="20,120 60,110 90,130 110,160 90,200 40,190 20,160" fill="#c3c8cf"/>
  <polygon points="0,200 40,190 60,230 30,260 0,250" fill="#5d646e"/>

  <!-- Falaise droite -->
  <polygon points="1200,80 1150,95 1120,85 1090,110 1070,140 1040,160 1010,200 980,260 960,300 1200,300" fill="#9aa0a8"/>
  <polygon points="1180,120 1140,130 1120,160 1140,190 1180,180" fill="#c3c8cf"/>

  <!-- Cerisier gauche -->
  <polygon points="150,230 170,230 175,300 140,300" fill="#4a2f22"/>
  <rect x="120" y="200" width="30" height="6" fill="#4a2f22"/>
  <rect x="170" y="180" width="26" height="6" fill="#4a2f22"/>
  <polygon points="20,170 60,150 70,120 110,110 130,80 170,70 200,90 240,80 270,110 300,120 320,160 300,190 260,200 230,230 170,230 130,210 80,215 40,200" fill="url(#blossom)"/>
  <polygon points="90,160 120,150 150,165 130,190 100,185" fill="url(#blossom)"/>

  <!-- Cerisier droit -->
  <polygon points="840,300 860,240 880,210 900,200 920,180 940,170 960,150 975,130 990,120 1000,140 980,170 960,210 940,240 930,300" fill="#5a3a28"/>
  <polygon points="760,60 800,40 850,30 900,45 950,25 1000,40 1040,60 1070,90 1060,130 1020,150 1000,190 950,200 900,185 860,210 820,190 790,160 770,120" fill="url(#blossom)"/>
  <polygon points="1040,150 1080,140 1120,160 1110,190 1070,200 1040,180" fill="#f5b5c8"/>

  <!-- Cascade -->
  <rect x="480" y="90" width="200" height="22" fill="#5d646e"/>
  <rect x="500" y="100" width="160" height="165" fill="#bfe9f5"/>
  <g clip-path="url(#fallClip)">
    <g class="fall">
      <rect x="510" y="90" width="20" height="30" fill="#ffffff"/>
      <rect x="560" y="100" width="12" height="36" fill="#ffffff"/>
      <rect x="600" y="92" width="24" height="28" fill="#ffffff"/>
      <rect x="530" y="140" width="16" height="30" fill="#e6f7ff"/>
      <rect x="620" y="150" width="20" height="30" fill="#ffffff"/>
      <rect x="510" y="190" width="24" height="30" fill="#e6f7ff"/>
      <rect x="575" y="200" width="16" height="30" fill="#ffffff"/>
      <rect x="640" y="220" width="16" height="30" fill="#e6f7ff"/>
      <rect x="520" y="240" width="20" height="30" fill="#ffffff"/>
    </g>
  </g>

  <!-- Bassin -->
  <rect x="430" y="255" width="330" height="45" fill="#2f9bb0"/>
  <rect x="430" y="255" width="330" height="5" fill="#7fe0e8"/>
  <rect x="470" y="272" width="50" height="5" fill="#7fe0e8" class="shine"/>
  <rect x="640" y="284" width="60" height="5" fill="#7fe0e8" class="shine s2"/>
  <rect x="720" y="266" width="40" height="5" fill="#7fe0e8" class="shine"/>

  <!-- Rochers du bassin -->
  <polygon points="380,270 410,255 440,262 460,285 450,300 380,300" fill="#6f757e"/>
  <polygon points="390,278 410,268 425,276 410,290 392,290" fill="#9aa0a8"/>
  <polygon points="790,270 820,258 850,268 870,300 790,300" fill="#6f757e"/>

  <!-- Sol et mousse -->
  <polygon points="0,250 60,235 120,245 180,240 200,270 200,300 0,300" fill="url(#moss)"/>
  <polygon points="0,265 40,262 80,270 60,300 0,300" fill="url(#pinkbush)"/>
  <polygon points="100,270 180,262 200,300 90,300" fill="url(#pinkbush)"/>
  <polygon points="1200,250 1140,240 1080,250 1040,270 1040,300 1200,300" fill="url(#moss)"/>
  <polygon points="1100,270 1200,262 1200,300 1110,300" fill="url(#pinkbush)"/>
  <polygon points="860,285 920,278 960,300 860,300" fill="url(#moss)"/>

  <!-- Pétales qui tombent -->
  <rect class="petal" x="300" y="60" width="4" height="4" fill="#f5b5c8"/>
  <rect class="petal p2" x="620" y="50" width="4" height="4" fill="#f5b5c8"/>
  <rect class="petal p3" x="880" y="90" width="4" height="4" fill="#e98aa6"/>

  <!-- Titre -->
  <rect x="40" y="26" width="400" height="76" fill="#14162b" opacity="0.85"/>
  <rect x="40" y="26" width="400" height="4" fill="#f5b5c8"/>
  <text x="62" y="78" font-family="Courier New, monospace" font-weight="bold" font-size="46" fill="#f5b5c8">CHRIS N'CHO</text>
  <text x="62" y="96" font-family="Courier New, monospace" font-size="12" fill="#fff6e6" letter-spacing="2">COMPUTER SCIENCE STUDENT</text>
</svg>
